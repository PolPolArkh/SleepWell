<!DOCTYPE html>
<html lang="ru" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SleepWell — Корзина</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body class="bg-body-tertiary d-flex flex-column min-vh-100">

    <nav class="sw-navbar">
      <div class="sw-navbar-inner">
        <a class="sw-brand" href="/">SleepWell</a>
        <ul class="sw-links">
          <li><a href="/">Главная</a></li>
          <li><a href="/catalog">Каталог</a></li>
          <li><a href="/cart" class="active">Корзина</a></li>
          <li><a href="/account">Профиль</a></li>
        </ul>
        <form class="sw-search" role="search">
          <input type="search" placeholder="Поиск" aria-label="Search">
          <button type="submit">Найти</button>
        </form>
      </div>
    </nav>

    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

    <main class="container cart-main">
        <h1 class="cart-title">Ваша корзина</h1>

        <div class="cart-wrap">
            <div class="cart-inner">
                {% if not items %}
                    <p class="cart-empty">Корзина пуста</p>
                {% else %}
                    <ul class="cart-list">
                        {% for item in items %}
                            <li class="cart-item">
                                <span class="cart-name"><b>{{ item.product_name }}</b></span>
                                <span class="cart-price">{{ item.price }} ₽</span>
                                <form method="post" action="/remove-from-cart/{{ item.id }}" class="cart-remove">
                                    <button type="submit" class="remove-btn">Удалить</button>
                                </form>
                            </li>
                        {% endfor %}
                    </ul>

                    <h3 class="cart-total">
                        Итого: <span>{{ total }} ₽</span>
                    </h3>
                {% endif %}

                <div class="cart-back">
                    <a href="/catalog">← Вернуться в каталог</a>
                </div>
            </div>
        </div>
    </main>

    <style>
        * { box-sizing: border-box; }
        html, body { overflow-x: hidden; }
        .sw-navbar { background: #cffcec; border-bottom: 1px solid #a3f5d6; position: sticky; top: 0; z-index: 1030; }
        .sw-navbar-inner { max-width: 1200px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
        .sw-brand { font-family: "Arial Black", Arial, sans-serif; font-size: 22px; color: #205935; text-decoration: none; letter-spacing: 0.5px; flex: 0 0 auto; }
        .sw-links { list-style: none; display: flex; flex-wrap: wrap; gap: 4px; margin: 0; padding: 0; flex: 1 1 auto; }
        .sw-links a { display: block; padding: 8px 12px; border-radius: 8px; color: #205935; text-decoration: none; font-family: "Arial Narrow", Arial, sans-serif; font-size: 17px; font-weight: 600; transition: background 0.15s; white-space: nowrap; }
        .sw-links a:hover, .sw-links a.active { background: #b8ffe5; }
        .sw-search { display: flex; gap: 6px; flex: 0 0 auto; }
        .sw-search input { width: 160px; padding: 8px 10px; border: 1px solid #a3f5d6; border-radius: 8px; background: #f6fffb; font-family: "Arial Narrow", Arial, sans-serif; font-size: 15px; outline: none; }
        .sw-search input:focus { border-color: #205935; }
        .sw-search button { padding: 8px 14px; border: none; background: #b8ffe5; color: #205935; border-radius: 8px; font-family: "Arial Narrow", Arial, sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; }
        .sw-search button:hover { background: #9af5d6; }
        .cart-main { max-width: 800px; margin-top: 30px; flex: 1; padding-left: 8px; padding-right: 8px; }
        .cart-title { font-family: "Arial Black", Arial, sans-serif; color: #205935; font-size: 30px; }
        .cart-wrap { background-color: #cffcec; padding: 20px; border-radius: 15px; margin-top: 20px; }
        .cart-inner { background-color: #fff; padding: 30px; border-radius: 15px; }
        .cart-empty { font-size: 22px; text-align: center; font-family: "Arial Narrow", Arial, sans-serif; }
        .cart-list { list-style: none; padding: 0; font-size: 20px; font-family: "Arial Narrow", Arial, sans-serif; }
        .cart-item { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; border-bottom: 1px solid #eee; padding: 14px 0; }
        .cart-name { flex: 1 1 160px; word-break: break-word; }
        .cart-price { margin-right: 12px; white-space: nowrap; }
        .cart-remove { margin: 0; }
        .remove-btn { background: #ffcccc; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; color: #d64545; font-weight: bold; font-family: inherit; font-size: 15px; }
        .cart-total { text-align: right; font-size: 24px; margin-top: 20px; font-family: "Arial Narrow", Arial, sans-serif; }
        .cart-total span { color: #205935; font-family: "Arial Black", Arial, sans-serif; }
        .cart-back { text-align: center; margin-top: 30px; }
        .cart-back a { text-decoration: none; color: #205935; font-size: 20px; font-weight: bold; font-family: "Arial Narrow", Arial, sans-serif; }
        @media (max-width: 720px) {
            .sw-navbar-inner { gap: 8px; padding: 8px 10px; }
            .sw-brand { font-size: 19px; }
            .sw-links { order: 3; flex: 1 1 100%; justify-content: flex-start; gap: 2px; }
            .sw-links a { padding: 7px 10px; font-size: 16px; }
            .sw-search { order: 4; flex: 1 1 100%; }
            .sw-search input { width: auto; flex: 1; }
            .cart-title { font-size: 22px; }
            .cart-wrap { padding: 12px; }
            .cart-inner { padding: 16px; }
            .cart-list { font-size: 17px; }
            .cart-name { flex: 1 1 100%; }
            .cart-remove { margin-left: auto; }
            .cart-total { font-size: 20px; }
            .cart-back a { font-size: 17px; }
        }
    </style>
</body>
</html>
