<body class="bg-body-tertiary d-flex flex-column min-vh-100">

        <div class="container-fluid">
            <a class="navbar-brand" style="font-family: 'Arial Black', sans-serif;" href="/">SleepWell</a>
            <button class="btn-icon navbar-toggler" type="button"
                    data-bs-toggle="drawer" data-bs-target="#navbarDrawer"
                    aria-controls="navbarDrawer" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon" aria-hidden="true"></span>
            </button>
            <dialog class="drawer drawer-end" tabindex="-1" id="navbarDrawer" aria-labelledby="navbarDrawerLabel">
                <div class="drawer-header">
                    <h5 class="drawer-title" id="navbarDrawerLabel">Меню</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
                </div>
                <div class="drawer-body mb-2 md:mb-0">
                    <ul class="nav navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="/account">Профиль</a>
                        </li>

                        </li>
                        <li>
                            <a class="nav-link" href="/catalog">Каталог</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="/cart">Корзина</a>
                        </li>
                    </ul>
                    <form class="hstack gap-2" role="search">
                        <input class="form-control" type="search" placeholder="Поиск" aria-label="Search">
                        <button class="btn-solid btn-icon theme-secondary" type="submit">
                            <svg class="bi" width="16" height="16"><use href="#search" /></svg>
                        </button>
                    </form>
                </div>
            </dialog>
        </div>
    </nav>
    
    <div class="Katalog-title">
        <h1>Каталог</h1>
    </div>
    <div class="tovari" id="catalog"></div>
    
    <style>
        .Katalog-title {
            font-family: "Arial Black", sans-serif;
            font-size: 30px;
            margin: 20px 5px;
        }

        .tovari {
            background-color: #cffcec;
            color: #000;
            padding: 20px;
            border-radius: 8px;
            margin: 0 5px 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .product-card {
            background-color: #fff;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .product-image {
            margin: 0 0 12px;
        }

        .product-image img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 6px;
            display: block;
        }

        .product-content {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title {
            font-family: "Arial Narrow";
            font-size: 25px;
            margin: 0 0 8px;
        }
        .product-price {
            font-family: "Arial Narrow";
            font-size: 20px;
        }
        .product-description {
            font-family: "Arial Narrow";
            font-size: 20px;
            color: #555;
            margin: 0 0 12px;
        }
        .product-button {
            background-color: #b8ffe5;
            border: none;
            font-family: "Arial Narrow", sans-serif;
            font-size: 20px;
            border-radius: 10px;
            padding: 6px 14px;
            cursor: pointer;
        }
        .product-button:hover {
            background-color: #8ff5cf;
        }
        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            gap: 10px;
        }
    </style>
