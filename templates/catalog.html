<!DOCTYPE html>
<html lang="ru" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SleepWell</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body class="bg-body-tertiary d-flex flex-column min-vh-100">

    <nav class="sw-navbar">
      <div class="sw-navbar-inner">
        <a class="sw-brand" href="/">SleepWell</a>
        <ul class="sw-links">
          <li><a href="/">Главная</a></li>
          <li><a href="/catalog" class="active">Каталог</a></li>
          <li><a href="/cart">Корзина</a></li>
          <li><a href="/account">Профиль</a></li>
        </ul>
        <form class="sw-search" role="search">
          <input type="search" placeholder="Поиск" aria-label="Search">
          <button type="submit">Найти</button>
        </form>
      </div>
    </nav>

    <div class="Katalog-title"><h1>Каталог</h1></div>

    <div class="filters">
        <select id="filterCat">
            <option value="all">Все категории</option>
            <option value="1">Матрасы</option>
            <option value="2">Подушки</option>
            <option value="3">Одеяла</option>
            <option value="4">Маски</option>
            <option value="5">Беруши</option>
            <option value="6">Бельё</option>
        </select>
        <select id="filterSort">
            <option value="default">Без сортировки</option>
            <option value="asc">Цена ↑</option>
            <option value="desc">Цена ↓</option>
        </select>
    </div>

    <div class="tovari" id="catalog"></div>

    <style>
        * { box-sizing: border-box; }
        html, body { overflow-x: hidden; }
        img { max-width: 100%; height: auto; }
        .sw-navbar { background: #cffcec; border-bottom: 1px solid #a3f5d6; position: sticky; top: 0; z-index: 1030; }
        .sw-navbar-inner { max-width: 1200px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
        .sw-brand { font-family: "Arial Black", Arial, sans-serif; font-size: 22px; color: #205935; text-decoration: none; letter-spacing: 0.5px; flex: 0 0 auto; }
        .sw-links { list-style: none; display: flex; flex-wrap: wrap; gap: 4px; margin: 0; padding: 0; flex: 1 1 auto; }
        .sw-links a { display: block; padding: 8px 12px; border-radius: 8px; color: #205935; text-decoration: none; font-family: "Arial Narrow", Arial, sans-serif; font-size: 17px; font-weight: 600; transition: background 0.15s; white-space: nowrap; }
        .sw-links a:hover, .sw-links a.active { background: #b8ffe5; }
        .sw-search { display: flex; gap: 6px; flex: 0 0 auto; }
        .sw-search input { width: 160px; padding: 8px 10px; border: 1px solid #a3f5d6; border-radius: 8px; background: #f6fffb; font-family: "Arial Narrow", Arial, sans-serif; font-size: 15px; outline: none; }
        .sw-search input:focus { border-color: #205935; }
        .sw-search button { padding: 8px 14px; border: none; background: #b8ffe5; color: #205935; border-radius: 8px; font-family: "Arial Narrow", Arial, sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; }
        .sw-search button:hover { background: #9af5d6; }
        .Katalog-title { font-family: "Arial Black", Arial, sans-serif; font-size: 30px; margin: 20px 8px; }
        .filters { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 8px 15px; }
        .filters select { flex: 1 1 160px; min-width: 0; font-family: "Arial Narrow", Arial, sans-serif; font-size: 16px; padding: 8px 10px; border: 1px solid #a3f5d6; border-radius: 8px; background: #cffcec; }
        .tovari { background-color: #cffcec; color: #000; padding: 14px; border-radius: 8px; margin: 0 8px 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
        .product-card { background-color: #fff; border-radius: 8px; padding: 20px; display: flex; flex-direction: column; }
        .product-image { margin: 0 0 12px; }
        .product-image img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 6px; display: block; }
        .product-content { display: flex; flex-direction: column; flex-grow: 1; }
        .product-title { font-family: "Arial Narrow", Arial, sans-serif; font-size: 20px; margin: 0 0 8px; }
        .product-price { font-family: "Arial Narrow", Arial, sans-serif; font-size: 18px; }
        .product-button { background-color: #b8ffe5; border: none; font-family: "Arial Narrow", Arial, sans-serif; font-size: 17px; border-radius: 10px; padding: 8px 12px; cursor: pointer; }
        .product-button:hover { background-color: #8ff5cf; }
        .product-footer { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; margin-top: auto; gap: 8px; }
        .product-footer form { width: 100%; margin: 0; }
        .product-footer .product-button { width: 100%; }
        @media (max-width: 720px) {
            .sw-navbar-inner { gap: 8px; padding: 8px 10px; }
            .sw-brand { font-size: 19px; }
            .sw-links { order: 3; flex: 1 1 100%; justify-content: flex-start; gap: 2px; }
            .sw-links a { padding: 7px 10px; font-size: 16px; }
            .sw-search { order: 4; flex: 1 1 100%; }
            .sw-search input { width: auto; flex: 1; }
            .Katalog-title { font-size: 22px; }
            .tovari { grid-template-columns: 1fr; padding: 10px; margin: 0 8px 16px; }
        }
    </style>

    <script>

  { id: 40, cat: 6, name: "Постельное бельё Виши из Бязи",    price: 1960,  stock: 26, img: "/static/belio/belyo_Vishi_iz_byazi.jpg"},
  { id: 41, cat: 6, name: "Постельное бельё Everett",         price: 1660,  stock: 43, img: "/static/belio/belyo_Everett.jpg"}
        ];

        function render() {
            let list = products.filter(p =>
                filterCat.value === 'all' || p.cat == filterCat.value
            );
            if (filterSort.value === 'asc')  list.sort((a, b) => a.price - b.price);
            if (filterSort.value === 'desc') list.sort((a, b) => b.price - a.price);

            document.getElementById('catalog').innerHTML = list.map(p => `
                <article class="product-card">
                    <figure class="product-image"><img src="${p.img}" alt="${p.name}" loading="lazy"></figure>
                    <div class="product-content">
                        <h3 class="product-title">${p.name}</h3>
                        <div class="product-footer">
                            <span class="product-price">${p.price} руб</span>
                            <form method="post" action="/add-to-cart">
                                <input type="hidden" name="product_name" value="${p.name}">
                                <input type="hidden" name="price" value="${p.price}">
                                <button type="submit" class="product-button">В корзину</button>
                            </form>
                        </div>
                    </div>
                </article>
            `).join('');
        }

        filterCat.onchange = render;
        filterSort.onchange = render;
        render();
    </script>
</body>
</html>
