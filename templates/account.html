<!DOCTYPE html>
<html lang="ru" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Личный кабинет — SleepWell</title>
    <!-- Это с bootstrap короче -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body class="bg-body-tertiary d-flex flex-column min-vh-100">
    <nav class="navbar md:navbar-expand bg-1">
  <div class="container-fluid">
    <a class="navbar-brand" style= "font-family: Arial Black, sans-serif;" href="/">SleepWell</a>
    <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarDrawer" aria-controls="navbarDrawer" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon" aria-hidden="true"></span>
    </button>
    <dialog class="drawer drawer-end" tabindex="-1" id="navbarDrawer" aria-labelledby="navbarDrawerLabel">
      <div class="drawer-header">
        <h5 class="drawer-title" id="navbarDrawerLabel">Меню</h5>
        <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
      </div>
      <div class="drawer-body mb-2 md:mb-0">
        <ul class="nav navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="/account">Профиль</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/">Главная</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/catalog">Каталог</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">Корзина</a>
          </li>
        </ul>
        <form class="hstack gap-2" role="search">
          <input class="form-control" type="search" placeholder="Поиск" aria-label="Search"/>
          <button class="btn-solid btn-icon theme-secondary" type="submit">
            <svg class="bi" width="16" height="16"><use href="#search" /></svg>
          </button>
        </form>
      </div>
    </dialog>
  </div>
</nav>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

    <!-- Заголовок личного кабинета -->
    <div class="info-box" style="display: flex; justify-content: space-between; align-items: center;">
        <h1 style="margin: 0;">Личный кабинет</h1>
        <a href="/logout" class="logout-btn">Выйти</a>
    </div>
    <div class="profile-grid">
        <div class="info-box" style="margin: 5px;">
            <div class="profile-card">
                <h2 class="profile-card-title">Личные данные</h2>
                <p class="profile-text"><b>Имя:</b> {{ user.full_name }}</p>
                <p class="profile-text"><b>Телефон:</b> {{ user.phone }}</p>
                <p class="profile-text"><b>Email:</b> {{ user.email }}</p>
            </div>
        </div>

        <div class="info-box" style="margin: 5px;">
            <div class="profile-card">
                <h2 class="profile-card-title">Статус</h2>
                <p class="profile-text"><b>Дата регистрации:</b> {{ user.created_at.strftime('%d.%m.%Y') }}</p>
                <div class="status-badge">
                    ✓ Аккаунт активен
                </div>
            </div>
        </div>
    </div>

    <hr class="lel">

    <style>
        .info-box {
            background-color: #cffcec;
            color: #000000;
            padding: 30px 30px;
            border-radius: 15px;
            margin: 5px;
        }

        .info-box h1 {
            font-size: 30px;
            font-family: "Arial Black";
        }

        .info-box p {
            font-size: 23px;
            font-family: "Arial Narrow";
        }

        .lol {
            position: relative;
            top: -15px;
        }

        .lel {
            position: relative;
            top: 12px;
        }

        .logout-btn {
            color: #d64545;
            text-decoration: none;
            font-weight: 600;
            font-family: "Arial Narrow";
            font-size: 20px;
            padding: 10px 25px;
            border: 2px solid #d64545;
            border-radius: 10px;
            background-color: #ffffff;
            transition: all 0.2s ease;
        }

        .logout-btn:hover {
            background-color: #d64545;
            color: #ffffff;
        }

        .profile-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .profile-card {
            background-color: #ffffff;
            border-radius: 15px;
            padding: 30px;
            height: 100%;
        }

        .profile-card-title {
            color: #205935;
            margin-bottom: 20px;
            font-size: 22px;
            font-family: "Arial Black", sans-serif;
        }

        .profile-text {
            font-size: 20px;
            font-family: "Arial Narrow", sans-serif;
            margin-bottom: 10px;
        }

        .status-badge {
            margin-top: 15px;
            padding: 12px;
            background: #e8f5e9;
            border-radius: 8px;
            color: #205935;
            font-family: "Arial Narrow", sans-serif;
            font-size: 20px;
        }

        @media (max-width: 768px) {
            .profile-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</body>
</html>
