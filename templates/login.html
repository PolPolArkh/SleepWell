<!DOCTYPE html>
<html lang="ru" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SleepWell — Вход</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body class="bg-body-tertiary d-flex flex-column min-vh-100">

    <nav class="sw-navbar">
      <div class="sw-navbar-inner">
        <a class="sw-brand" href="/">SleepWell</a>
        <ul class="sw-links">
          <li><a href="/">Главная</a></li>
          <li><a href="/catalog">Каталог</a></li>
          <li><a href="/cart">Корзина</a></li>
          <li><a href="/account" class="active">Профиль</a></li>
        </ul>
        <form class="sw-search" role="search">
          <input type="search" placeholder="Поиск" aria-label="Search">
          <button type="submit">Найти</button>
        </form>
      </div>
    </nav>

    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <hr class="lol">

    <main class="main container" style="width:100%; max-width:600px;">
        <div class="topbar">
            <h1>Вход в аккаунт</h1>
        </div>

        <div class="auth-wrapper">
            <div class="info-box">
                <div class="profile-card">
                    <h2 class="profile-card-title">Авторизация</h2>
                    {% if error %}
                        <p class="error-msg">{{ error }}</p>
                    {% endif %}
                    <form method="post" action="/login" class="auth-form">
                        <input type="email" name="email" placeholder="Email" required class="auth-input">
                        <input type="password" name="password" placeholder="Пароль" required class="auth-input">
                        <button type="submit" class="auth-btn">Войти</button>
                    </form>
                    <p class="auth-link-text">Нет аккаунта? <a href="/register" class="auth-link">Зарегистрироваться</a></p>
                </div>
            </div>
        </div>
    </main>

    <style>
        * { box-sizing: border-box; }
        html, body { overflow-x: hidden; }
        .sw-navbar { background: #cffcec; border-bottom: 1px solid #a3f5d6; position: sticky; top: 0; z-index: 1030; }
        .sw-navbar-inner { max-width: 1200px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
        .sw-brand { font-family: "Arial Black", Arial, sans-serif; font-size: 22px; color: #205935; text-decoration: none; letter-spacing: 0.5px; flex: 0 0 auto; }
        .sw-links { list-style: none; display: flex; flex-wrap: wrap; gap: 4px; margin: 0; padding: 0; flex: 1 1 auto; }
        .sw-links a { display: block; padding: 8px 12px; border-radius: 8px; color: #205935; text-decoration: none; font-family: "Arial Narrow", Arial, sans-serif; font-size: 17px; font-weight: 600; transition: background 0.15s; white-space: nowrap; }
        .sw-links a:hover, .sw-links a.active { background: #b8ffe5; }
        .sw-search { display: flex; gap: 6px; flex: 0 0 auto; }
        .sw-search input { width: 160px; padding: 8px 10px; border: 1px solid #a3f5d6; border-radius: 8px; background: #f6fffb; font-family: "Arial Narrow", Arial, sans-serif; font-size: 15px; outline: none; }
        .sw-search input:focus { border-color: #205935; }
        .sw-search button { padding: 8px 14px; border: none; background: #b8ffe5; color: #205935; border-radius: 8px; font-family: "Arial Narrow", Arial, sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; }
        .sw-search button:hover { background: #9af5d6; }
        .lol { position: relative; top: -15px; }
        .main { padding-left: 8px; padding-right: 8px; }
        .topbar { display: flex; justify-content: center; align-items: center; margin-bottom: 20px; }
        .topbar h1 { font-family: "Arial Black", Arial, sans-serif; color: #205935; font-size: 30px; }
        .auth-wrapper { display: flex; justify-content: center; margin-top: 20px; padding: 0 4px; }
        .info-box { background-color: #cffcec; color: #000; padding: 30px; border-radius: 15px; width: 100%; max-width: 460px; margin: 8px 0; }
        .profile-card { background-color: #fff; border-radius: 15px; padding: 30px; }
        .profile-card-title { color: #205935; margin-bottom: 20px; font-size: 22px; font-family: "Arial Black", Arial, sans-serif; }
        .auth-form { display: flex; flex-direction: column; gap: 15px; }
        .auth-input { padding: 12px 15px; border-radius: 10px; border: 1px solid #ccc; font-family: "Arial Narrow", Arial, sans-serif; font-size: 18px; transition: border-color 0.2s ease; }
        .auth-input:focus { outline: none; border-color: #205935; }
        .auth-btn { width: 100%; height: 50px; border-radius: 10px; background-color: #b8ffe5; border: none; font-family: "Arial Narrow", Arial, sans-serif; font-size: 22px; font-weight: 600; color: #205935; cursor: pointer; transition: background-color 0.2s ease; }
        .auth-btn:hover { background-color: #9af5d6; }
        .auth-link-text { margin-top: 15px; font-size: 16px; font-family: "Arial Narrow", Arial, sans-serif; text-align: center; }
        .auth-link { color: #205935; font-weight: 600; text-decoration: none; }
        .auth-link:hover { text-decoration: underline; }
        .error-msg { color: #d64545; margin-bottom: 15px; font-family: "Arial Narrow", Arial, sans-serif; font-size: 16px; text-align: center; }
        @media (max-width: 720px) {
            .sw-navbar-inner { gap: 8px; padding: 8px 10px; }
            .sw-brand { font-size: 19px; }
            .sw-links { order: 3; flex: 1 1 100%; justify-content: flex-start; gap: 2px; }
            .sw-links a { padding: 7px 10px; font-size: 16px; }
            .sw-search { order: 4; flex: 1 1 100%; }
            .sw-search input { width: auto; flex: 1; }
            .topbar h1 { font-size: 22px; text-align: center; }
            .info-box { padding: 14px; }
            .profile-card { padding: 16px; }
            .profile-card-title { font-size: 19px; }
            .auth-input { font-size: 16px; padding: 10px 12px; }
            .auth-btn { font-size: 19px; height: 46px; }
            .auth-link-text { font-size: 15px; }
        }
    </style>
</body>
</html>
