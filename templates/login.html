<!DOCTYPE html>
<html lang="ru" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SleepWell — Вход</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body class="bg-body-tertiary d-flex flex-column min-vh-100">
    <nav class="navbar md:navbar-expand bg-1">
  <div class="container-fluid">
    <a class="navbar-brand" style= "font-family: Arial Black, sans-serif;" href="/">SleepWell</a>
    <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarDrawer" aria-controls="navbarDrawer" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon" aria-hidden="true"></span>
    </button>
    <dialog class="drawer drawer-end" tabindex="-1" id="navbarDrawer" aria-labelledby="navbarDrawerLabel">
      <div class="drawer-header">
        <h5 class="drawer-title" id="navbarDrawerLabel">Меню</h5>
        <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
      </div>
      <div class="drawer-body mb-2 md:mb-0">
        <ul class="nav navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="/account">Профиль</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/">Главная</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/catalog">Каталог</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="/cart">Корзина</a>
          </li>
        </ul>
        <form class="hstack gap-2" role="search">
          <input class="form-control" type="search" placeholder="Поиск" aria-label="Search"/>
          <button class="btn-solid btn-icon theme-secondary" type="submit">
            <svg class="bi" width="16" height="16"><use href="#search" /></svg>
          </button>
        </form>
      </div>
    </dialog>
  </div>
</nav>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <hr class="lol">

    <main class="main container" style="max-width: 600px;">
        <div class="topbar" style="display: flex; justify-content: center; align-items: center; margin-bottom: 20px;">
            <h1 style="font-family: 'Arial Black', sans-serif; color: #205935;">Вход в аккаунт</h1>
        </div>

        <div class="auth-wrapper">
            <div class="info-box">
                <div class="profile-card">
                    <h2 class="profile-card-title">Авторизация</h2>
                    {% if error %}
                        <p class="error-msg">{{ error }}</p>
                    {% endif %}
                    <form method="post" action="/login" class="auth-form">
                        <input type="email" name="email" placeholder="Email" required class="auth-input">
                        <input type="password" name="password" placeholder="Пароль" required class="auth-input">
                        <button type="submit" class="auth-btn">Войти</button>
                    </form>
                    <p class="auth-link-text">Нет аккаунта? <a href="/register" class="auth-link">Зарегистрироваться</a></p>
                </div>
            </div>
        </div>
    </main>

    <style>
        .lol { position: relative; top: -15px; }
        .auth-wrapper { display: flex; justify-content: center; margin-top: 20px; }
        .info-box { background-color: #cffcec; color: #000000; padding: 30px; border-radius: 15px; width: 100%; max-width: 460px; margin: 5px; }
        .profile-card { background-color: #ffffff; border-radius: 15px; padding: 30px; }
        .profile-card-title { color: #205935; margin-bottom: 20px; font-size: 22px; font-family: "Arial Black", sans-serif; }
        .auth-form { display: flex; flex-direction: column; gap: 15px; }
        .auth-input { padding: 12px 15px; border-radius: 10px; border: 1px solid #ccc; font-family: "Arial Narrow", sans-serif; font-size: 18px; transition: border-color 0.2s ease; }
        .auth-input:focus { outline: none; border-color: #205935; }
        .auth-btn { width: 100%; height: 50px; border-radius: 10px; background-color: #b8ffe5; border: none; font-family: "Arial Narrow", sans-serif; font-size: 22px; font-weight: 600; color: #205935; cursor: pointer; transition: background-color 0.2s ease; }
        .auth-btn:hover { background-color: #9af5d6; }
        .auth-link-text { margin-top: 15px; font-size: 16px; font-family: "Arial Narrow", sans-serif; text-align: center; }
        .auth-link { color: #205935; font-weight: 600; text-decoration: none; }
        .auth-link:hover { text-decoration: underline; }
        .error-msg { color: #d64545; margin-bottom: 15px; font-family: "Arial Narrow", sans-serif; font-size: 16px; text-align: center; }
    </style>
</body>
</html>
